<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <link rel="stylesheet" href="mdn.css">
</head>
<body>
    <h1>Grid layout using line-based placement.</h1>
    <div class="wrapper">
  <div class="box1">One</div>
  <div class="box2">Two</div>
  <div class="box3">Three</div>
  <div class="box4">Four</div>
</div>

<!-- Default spans with longhand placement. -->
 <h2>Default spans with longhand placement</h2>
  <div class="wrapper2">
  <div class="box5">Five</div>
  <div class="box6">Six</div>
  <div class="box7">Seven</div>
  <div class="box8">Eight</div>
</div>

<h2>grid-area property</h2>
  <div class="wrapper3">
  <div class="area-1">Area-1</div>
  <div class="area-2">Area-2</div>
  <div class="area-3">Area-3</div>
  <div class="area-4">Area-4</div>
</div>

<h2>Counting backward</h2>
 <div class="wrapper4">
  <div class="box-1">One</div>
  <div class="box-2">Two</div>
  <div class="box-3">Three</div>
  <div class="box-4">Four</div>
</div>
</body>
</html>
