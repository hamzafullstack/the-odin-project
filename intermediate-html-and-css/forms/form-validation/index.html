<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-Validation</title>
    <style>
        form,
label {
  display: flex;
  flex-direction: column;
}

form {
  max-width: 250px;
  gap: 12px;
}
    </style>
</head>
<body>
    <!--Form Validation
    validations allow us to set specific constraints or rules that determine what data users can enter into an input.
    validations are a vital ingredient in well-designed forms. they help protect our backend systems from receiving incorrect data..
    -->

    <!--
    Required validation
    we will often want to ensure specific fields have been filled before submiting the form.
    -->
    <form action="#" method="get">
  <label for="user_email">
    *Email:
    <input type="email" id="user_email" name="user_email" required>
  </label>

  <label for="user_password">
    *Password:
    <input type="password" id="user_password" name="user_password" required>
  </label>

  <button type="submit">Login</button>
</form>
<!--To ensure a good user experience and to meet accessibility guidelines, we should always indicate which is fields are required.-->

<!--
Text length validations
sometimes we will want users to enter a minimum or maximum amount of text into a field. Real-World examples of using validations would be the old 140 charecter limit that x (formerly twitter) used to have in its status field..

Minimum length validation.
to add minimum length validation we give the form control a minlength attribute.

-->
<form action="#" method="get">
  <textarea placeholder="What's happening?" minlength="3"></textarea>

  <button type="submit">Tweet</button>
</form>

<!--maximum length validation
to add a maximum length validation we give form control a max length attribute with an integer value which represent the max number of charectors.
-->
<form action="#" method="get">
  <textarea placeholder="What's happening?" maxlength="20"></textarea>

  <button type="submit">Tweet</button>
</form>
<!--
combining validations
HTML allows us to apply as many validations as we wish to a form control.
-->
<form action="#" method="get">
  <textarea placeholder="What's happening?" minlength="5" maxlength="20"></textarea>

  <button type="submit">Tweet</button>
</form>

<!--
Number range validations
just like we often need to control the length of text-based form controls, there will be many situations where we will want to control the range of values users can enter into numbers.

we can do this with the min and max attributes, which allows us to change set the lower and upper bounds of the value entered into the form control.

min and max attributes only work with number-based form controls.
mdn reference 
https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/max#syntax

some real-world use cases for using these validations would be limiting the quanity on a product order form or choosing the number of passengers on a flight booking form.
-->
<p>Min validation</p>
form action="#" method="get">
  <label for="quantity">
    Quantity <input type="number" id="quantity" name="quantity" min="1" value="0">
  </label>

  <button type="submit">Place Order</button>
</form>

<p>max validation</p>
<form action="#" method="get">
  <label for="passengers">
    Passengers
    <input type="number" id="passengers" name="passengers" max="5" value="0">
  </label>

  <button type="submit">Book</button>
</form>

<!--
pattern validations
to ensure we get the correct information from the users, we will often want to ensure data matches a particular pattern.
Real-world applications include checking if a password, credit card number, or a zipcode is in the correct format.
you often use Regex - regular expressions
https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_expressions

-->
<form action="#" method="get">
  <label for="zip_code">
    Postal / Zip Code:
    <input type="text" id="zip_code" name="zip_code" pattern="(\d{5}([\-]\d{4})?)" required>
  </label>

  <button type="submit">Submit</button>
</form>
<!--
Styling validations
the :user-valid and :user-invalid pseudo-classes allow targeting form controls that have passed or failed validation, ensuring input fields remain neutral until user interaction.
-->
<style>
  input:user-valid {
  border-color: green;
}

input:user-invalid {
  border-color: red;
}

/* Ignore below here */

input {
  border: 2px solid #000;
  padding: 5px;
  border-radius: 5px;
}

form,
label {
  display: flex;
  flex-direction: column;
}

form {
  max-width: 250px;
  gap: 12px;
}
</style>
<form action="#" method="get">
  <label for="email">
    Email
    <input type="email" id="email" name="email">
  </label>

  <label for="website">
    Website
    <input type="url" id="website" name="website">
  </label>

  <button type="submit">Submit</button>
</form>
