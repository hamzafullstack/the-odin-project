<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Basics</title>
</head>
<body>
    <!-- 
    forms are one the most critical parts of your site. they are your user's gateway into backend. the user provides data in a form and you do stuff with it.

    -->
    <!-- 
    The Form Element
    the form is a container element like the div element, the form element wraps all of the inputs a user will interact with on a form.
    the form element accepts two essential attributes first is action and second is method.
    action attribute takes a url value that tells the form where it should send its data to processed
    the method attribute which tells the browser which HTTP request method it should use to submit the form.
    https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Methods

    We use GET when we want to retrieve something from the server. for example Google uses a GET request to when you search as it gets the search results.


    POST is used when we want to change something on the server, for example when a user makes an account or makes a payment on a website..
    -->
    <!-- The markup creating a form element looks like this -->
     <form action="example.com/path" method="post">

     </form>
     <!-- Form Controls -->
      <!-- 
     To start collecting user data, we need to use form control elements. These are all the elements users will interact with on the form. such as text boxes, dropdowns, checkboxes, and buttons. 
     in the following few sections we will explore some of the form controls you will use most commonly.
      -->
     <!-- 
     The input element
     The input element is the most versatile of all the form control elements. it accepts a type attribute which tells the browser what type of data it should except and how it should render the input element. 
     -->
     <!-- a text input looks like this -->
      <form action="example.com/path" method="post">
        <input type="text">
      </form>
      <!-- 
      text input accept any text input. you would use it to collect things like user's first and last names.
      -->

      <!-- labels
      an input on its own isn't very useful since the user will not know what kind of data they are supposed to provide. instead we can give our inputs a label to inform users what type of data they are excepted to enter.
      to create a label we use the <label> element. the text we want displayed in the label will go between its opening and closing tags. 
      -->
        <form action="example.com/path" method="post">
            <label for="first_name">First Name:</label>
            <input type="text" id=first_name">
        </form>
        <!-- 
        labels accept a for attribute, which associates it with a particular input. the input we want to associate with a label needs an id attribute with the same value as the label's for attribute.
        when label is associated with an input and is clicked, it will focus the cursor on that input, ready for the user to input some data.
        -->

        <!-- Placeholder attribute -->
         <!-- 
        To guide users on what to enter in form elements, we can include placeholder text in input fields.
        this is done by adding placeholder attribute to an input. the value will be the placeholder text.
         -->
        <label for="first_name">First name</label>
        <input type="text" id="first_name" placeholder="Shoaib.....">

        <!-- use placeholder text to demonstrate how text should be entered and formatted. -->
         <!-- 
        The name attribute:
        we need to use labels so that users understand what the data entered into an input field will represent. just like that we also need to let the backend, where we send our data, know what each piece of data represents.
        we do this by adding a name attribute to our inputs.
         -->
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name">
        <!-- 
        The name attribute serves as a reference to the data inputted into a form control after submitting it. you can think of it as variable name for the input. 
        form input should always have a name attribute otherwise it will be ignored when a the form is submitted.
        -->
        <form action="httpbin.org/post" method="post">
          <div>
            <label for="first_name">First Name</label>
            <input type="text" name="first_name" id="first_name">
          </div>
          <div>
            <label for="last_name">Last Name</label>
            <input type="text" name="last_name" id="last_name">
          </div>
          <div>
          <label for="age">Age</label>
          <input type="number" name="age" id="age">
          </div>
          <button type="submit">submit</button>
        </form>

        <!-- 
        The output from the response is the form object
        "form": {
    "age": "33",
    "first_name": "John",
    "last_name": "Doe"
  },

        -->
  <!-- 
  using the form controls outside of forms
  its worth mentioning that you can use any of the form controls HTML provides outside of the <form> element, even when you don't have a backend server you can send data.
    
    you can do so with javascript. using some javascript DOM - Browser APIs.
    we will need to manipulate data from form controls like this in the projects later in the curriculum.
    
  -->

  <!-- 
  The Type Attribute
  Email input are specialized text inputs just for email addresses. they are different from text inputs in that they will display a different keyboard which will include the @ symbol on mobile devices to make entering email addresses easier.
  they also validate that the user has entered a correctly formatted email address. 
    -->
  <label for="user_email">Email Address</label>
  <input type="email" id="user_email" name="email" placeholder="you@yourmail.com">

  <!-- 
  Password: 
  Password inputs are another specialized text inputs. they differ from regular text inputs in that they mask the inputted data with another character - usually an asterik(*) or bullet point to prevent anyone from seeing what has been entered.
  A password input can be created with type of password 
  -->
  <label for="user_password"> Password</label>
  <input type="password" id="user_password" name="password" placeholder="Enter Your Password">

  <!-- Number Type 
  the Number input only accepts number values and ignore any other charactors the user enters. 
  -->
  <label for="amount">Amount</label>
  <input type="number" id="amount" name="amount">

  <!-- 
  to collect dates from a user we can use date input. this input is unique because it provides better user experience.
  -->
  <label for="dob">Date of Birth</label>
  <input type="date" id="dob" name="dob">

  <!-- 
  Text area:
  while technically not an input element, the text area element provides an input box that can accept text that spans multiple lines like user comments and reviews, it can be resized.
  -->
  <textarea></textarea>
  <!-- unlike input elements, textarea elements do have closing tags this allows you to wrap some initial content you want to the text area to display. -->
   <textarea>Some initial content</textarea>
   <!-- text area accept a couple of unique attributes that other form controls do not. that are the row and cols attribute. they allow you to control the initial height(row) and width(cols) of text area -->
    <textarea rows="20" cols="20">your text here</textarea>

    <!-- 
    Selection elements
    sometimes you will want users to select a value from a predefined list. this is where select elements will be useful.

    Select dropdown.
    the select element renders a dropdown list where users can select an option.
    select element wraps option elements which are the options that can be used selected.
    -->
    <select name="Car">
      <option value="mercedes">Mercedes</option>
      <option value="tesla">Tesla</option>
      <option value="toyota">Toyota</option>
      <option value="bmw">BMW</option>
      <option value="nissan">Nissan</option>
      <option value="volvo">Volvo</option>
    </select>
    <!-- 
    All the option elements should have a value attribute otherwise the text content inside it used this value be sent to the server when the form is submitted.

    we can set one of the option to be default selected element when the browser first renders the form.
    -->
    <select name="Car">
  <option value="mercedes">Mercedes</option>
  <option value="tesla">Tesla</option>
  <option value="volvo" selected>Volvo</option>
  <option value="bmw">BMW</option>
  <option value="mini">Mini</option>
  <option value="ford">Ford</option>
</select>
<!-- 
we may also split the list of options into groups using optgroup element.
-->
<select name="fashion">
  <optgroup label="Clothing">
    <option value="t_shirt">T-Shirts</option>
    <option value="sweater">Sweaters</option>
    <option value="coats">Coats</option>
  </optgroup>
  <optgroup label="Foot Wear">
    <option value="sneakers">Sneakers</option>
    <option value="boots">Boots</option>
    <option value="sandals">Sandals</option>
  </optgroup>
</select>


</body>
</html>
