<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling web form</title>
    <link rel="stylesheet" href="stylingweb.css">
</head>
<body>
    <!--Challenges in styling form widgets
    History:
    in 1995 the html-2 specification introduced form controls, aka form widgets or form elements. css wasn't released until late 1996, and wasn't supported by most browsers.
    but now things have changed, and forms widgets are now mostly stylable with few exceptions.
    -->
    <!--
    Styling simple form widgets
    there are some types which are easy to style, like fieldset, legend, input without search type, textarea, buttons, labels, output
    and there are some hard to style which are checkboxes and search type input
    -->
    <form>
  <h1>to: Mozilla</h1>

  <div id="from">
    <label for="name">from:</label>
    <input type="text" id="name" name="user_name" />
  </div>

  <div id="reply">
    <label for="mail">reply:</label>
    <input type="email" id="mail" name="user_email" />
  </div>

  <div id="message">
    <label for="msg">Your message:</label>
    <textarea id="msg" name="user_message"></textarea>
  </div>

  <div class="button">
    <button type="submit">Send your message</button>
  </div>
</form>

</body>
</html>
