<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input-Types</title>
</head>
<body>
    <!--The HTML input types..
    https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Forms/HTML5_input_types
    -->
    <!--Email address field.-->
    <input type="email" name="email" id="email">
    <input type="email" id="email" name="email" multiple />
    
    <!--Client-side validation
    Email along with other newer input types provides built-in client-side error validation, performed by the browser before the data gets sent to server.
    -->

    <!--Search field.-->
    <input type="search" name="search" id="search">
    <!--
    The main difference between a text field and a search field is how the browser styles its appearance.
    -->
    <!--Phone Number field-->
    <input type="tel" name="tel" id="tel">
    <!--URL field-->
    <input type="url" name="url" id="url">
    <!--Numberic field-->
    <input type="number" id="number" name="number" />
    <input type="number" name="age" id="age" min="1" max="10" step="2" />
    <input type="number" name="change" id="pennies" min="0" max="1" step="0.01" />
    <!--slide control-->
    <label for="price">Choose a maximum house price: </label>
<input
  type="range"
  name="price"
  id="price"
  min="50000"
  max="500000"
  step="1000"
  value="250000" />
<output class="price-output" for="price"></output>
<!--Date and Time Picker-->
<input type="date" name="date" id="date" />
<input type="datetime-local" name="datetime" id="datetime" />
<input type="month" name="month" id="month" />
<input type="time" name="time" id="time" />
<input type="week" name="week" id="week" />
<!--Constraining date and time values.-->
<label for="myDate">When are you available this summer?</label><br />
<input
  type="date"
  name="myDate"
  min="2025-06-01"
  max="2025-08-31"
  step="7"
  id="myDate" />

  <!--Color Picker Control-->
  <input type="color" name="color" id="color" />


<script>
    const price = document.querySelector("#price");
const output = document.querySelector(".price-output");

output.textContent = price.value;

price.addEventListener("input", () => {
  output.textContent = price.value;
});
</script>
</body>
</html>
