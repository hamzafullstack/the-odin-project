<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input-Types</title>
</head>
<body>
    <!--The HTML input types..
    https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Forms/HTML5_input_types
    -->
    <!--Email address field.-->
    <input type="email" name="email" id="email">
    <input type="email" id="email" name="email" multiple />
    
    <!--Client-side validation
    Email along with other newer input types provides built-in client-side error validation, performed by the browser before the data gets sent to server.
    -->

    <!--Search field.-->
    <input type="search" name="search" id="search">
    <!--
    The main difference between a text field and a search field is how the browser styles its appearance.
    -->
    <!--Phone Number field-->
    <input type="tel" name="tel" id="tel">
    <!--URL field-->
    <input type="url" name="url" id="url">
    
</body>
</html>
