<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDN-webform</title>
</head>
<body>
    <!--The form element formally defines a form and attributes that determine the form's behavior. 
    each time you want to create an HTML form you must start it by using this element, nesting all the content inside.
    
    Warning: its strictly forbidden to nest a form inside another form. nesting can cause forms to behave unpredictably, so it is a bad idea.-->

    <fieldset>
        <legend>Fruit juice size</legend>
        <p>
            <input type="radio" name="size" id="size_1" value="small">
            <label for="size_1">Small</label>
        </p>
        <p>
    <input type="radio" name="size" id="size_2" value="medium" />
    <label for="size_2">Medium</label>
  </p>
  <p>
    <input type="radio" name="size" id="size_3" value="large" />
    <label for="size_3">Large</label>
  </p>

    </fieldset>

    <!--labels are clickable, too-->
    <p>
  <input type="checkbox" id="taste_1" name="taste_cherry" value="cherry" />
  <label for="taste_1">I like cherry</label>
</p>
<p>
  <input type="checkbox" id="taste_2" name="taste_banana" value="banana" />
  <label for="taste_2">I like banana</label>
</p>


<!--Mutliple label
strictly speaking you can put multiple labels on a single widget, but this is not a good idea as some assistive technologies can have trouble handling them.-->

<p>Please complete all required (*) fields.</p>
<!-- But this is probably best: -->
<div>
  <label for="username">Name *:</label>
  <input id="username" type="text" name="username" required />
</div>
<!--Common HTML structure used with forms
you can use all HTML Markup power to create forms
lists are recommanded for structuring multiple checkboxes or radio buttons.
in addition to the fieldset elements it is also common practice to use HTML titles h1 h2 and sectioning <section> to structure complex forms.

    Building a form structure.
-->
<form action="">
    <h1>Payment Form</h1>
    <p>Please complete all required (*) fields.</p>
    <section>
        <h2>Contact information</h2>
        <fieldset>
            <legend>Title</legend>
            <ul>
                <li>
                    <label for="title_1">
                        <input type="radio" name="title" id="title_1" value="A">
                        Ace
                    </label>
                </li>
                <li>
                    <label for="title_2">
                        <input type="radio" name="title" id="title_2" value="Q">
                        Queen
                    </label>
                </li>
                <li>
                    <label for="title_3">
                        <input type="radio" name="title" id="title_3" value="K">
                        King
                    </label>
                </li>
            </ul>
        </fieldset>
        <p>
            <label for="name">Name *:</label>
            <input type="text" name="username" id="name" required>
        </p>
        <p>
            <label for="email">Email *:</label>
            <input type="email" name="user-email" id="email" required>
        </p>
        <p>
            <label for="pwd">Password *:</label>
            <input type="password" name="password" id="pwd" required>
        </p>
    </section>
    <section>
        <h2>Payment information</h2>
        <p>
            <label for="card">
                <span>Card type:</span>
            </label>
            <select name="card" id="user-card">
                <option value="visa">Visa</option>
                <option value="mc">Mastercard</option>
                <option value="amex">American Express</option>
                <option value="up">Union Pay</option>
                <option value="pak">PayPak</option>
            </select>
        </p>
        <p>
            <label for="number">Card Number *:</label>
            <input type="tel" name="card-number" id="number" required>
        </p>
        <p>
            <label for="expiration">Expiry Date *:</label>
            <input type="text" name="expiration" id="expiration"required placeholder="MM/YY" pattern="^(0[1-9]|1[0-2])\/([0-9]{2})$" >
        </p>
    </section>
    <section>
  <p>
    <button type="submit">Validate the payment</button>
  </p>
</section>
</form>

</body>
</html>
