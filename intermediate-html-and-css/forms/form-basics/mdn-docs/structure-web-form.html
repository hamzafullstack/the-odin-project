<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDN-webform</title>
</head>
<body>
    <!--The form element formally defines a form and attributes that determine the form's behavior. 
    each time you want to create an HTML form you must start it by using this element, nesting all the content inside.
    
    Warning: its strictly forbidden to nest a form inside another form. nesting can cause forms to behave unpredictably, so it is a bad idea.-->

    <fieldset>
        <legend>Fruit juice size</legend>
        <p>
            <input type="radio" name="size" id="size_1" value="small">
            <label for="size_1">Small</label>
        </p>
        <p>
    <input type="radio" name="size" id="size_2" value="medium" />
    <label for="size_2">Medium</label>
  </p>
  <p>
    <input type="radio" name="size" id="size_3" value="large" />
    <label for="size_3">Large</label>
  </p>

    </fieldset>

    <!--labels are clickable, too-->
    <p>
  <input type="checkbox" id="taste_1" name="taste_cherry" value="cherry" />
  <label for="taste_1">I like cherry</label>
</p>
<p>
  <input type="checkbox" id="taste_2" name="taste_banana" value="banana" />
  <label for="taste_2">I like banana</label>
</p>


<!--Mutliple label
strictly speaking you can put multiple labels on a single widget, but this is not a good idea as some assistive technologies can have trouble handling them.-->

<p>Please complete all required (*) fields.</p>
<!-- But this is probably best: -->
<div>
  <label for="username">Name *:</label>
  <input id="username" type="text" name="username" required />
</div>

</body>
</html>
